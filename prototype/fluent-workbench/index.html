    : `<div class="picker"><label for="pick">Target</label><select id="pick" class="grow" data-input="pickTarget">${S.targets.map((x, i) => `<option value="t${i}" ${S.morphFocus === "targets" && i === S.selTarget ? "selected" : ""}>${esc(x.name)}</option>`).join("")}${S.npcs.map((x, i) => `<option value="n${i}" ${S.morphFocus === "npcs" && i === S.selNpc ? "selected" : ""}>NPC · ${esc(x.name)}</option>`).join("")}</select></div>`;

  const detail = S.area === "templates"
    ? `<div class="props"><div class="p"><b>${esc(p.name)}</b><span>Slider Preset</span></div><div class="p"><b>${p.uunp ? "UUNP" : "CBBE"}</b><span>body</span></div><div class="p"><b>${p.sliders}</b><span>sliders</span></div><div class="p"><b>${S.targets.filter(t => t.presets.includes(p.name)).length + S.npcs.filter(n => n.presets.includes(p.name)).length}</b><span>assignments</span></div><span class="grow"></span><button data-act="noop">Edit SetSliders…</button><button class="subtle" data-act="toggle-bos">BoS JSON</button></div>
       <div class="work">${S.notes.filter(n => n.durable && !n.dismissed).slice(0, 1).map(n => infobar(n)).join("")}<div class="muted">Template line</div><textarea readonly style="height:80px;flex:0 0 auto" aria-label="Template line">${esc(p.line)}</textarea><div class="muted">SetSliders</div><div class="card" style="flex:1;overflow:auto"><table><thead><tr><th>Slider</th><th>Min</th><th>Max</th></tr></thead><tbody>${p.line.split("=")[1].split(", ").map(s => { const [n, v] = s.split("@"); const [a, b] = v.split(":"); return `<tr><td>${esc(n)}</td><td class="mono">${a}%</td><td class="mono">${b || a}%</td></tr>`; }).join("")}</tbody></table></div></div>`
    : `<div class="props"><div class="p"><b class="mono">${esc(curTarget().name)}</b><span>${S.morphFocus === "targets" ? "Custom Morph Target" : `NPC · ${esc(curTarget().master)} · ${esc(curTarget().race)}`}</span></div><div class="p"><b>${curTarget().presets.length}</b><span>presets</span></div><span class="grow"></span>${S.morphFocus === "targets" ? `<button class="subtle danger" data-act="noop">Remove target</button>` : `<button class="subtle" data-act="noop">View Image</button>`}</div>
       <div class="work">${S.notes.filter(n => n.durable && !n.dismissed).slice(0, 1).map(n => infobar(n)).join("")}<div class="card">${presetsForTarget(curTarget())}</div><div class="muted">All NPC assignments</div><div class="card" style="flex:1;overflow:auto">${npcTable("tvNpc", true)}</div></div>`;

  const outpane = `<aside class="outpane" aria-label="Output"><header><b>Output</b><span class="muted">${S.output.at ? fmtTime(S.output.at) : ""}${S.output.stale && S.output.at ? " · stale" : ""}</span><span class="grow"></span><button class="subtle" data-act="copy" style="height:26px">Copy</button><button class="subtle" data-act="job" data-kind="exportIni" style="height:26px" ${S.job ? "disabled" : ""}>Export…</button>${narrow ? `<button class="subtle icon" data-act="toggle-drawer" aria-label="Close">✕</button>` : ""}</header><div class="tabs" role="tablist"><button role="tab" aria-selected="${S.outTab === "templates"}" data-act="outtab" data-t="templates">templates.ini</button><button role="tab" aria-selected="${S.outTab === "morphs"}" data-act="outtab" data-t="morphs">morphs.ini</button></div><div class="body"><textarea readonly aria-label="${S.outTab}.ini">${esc(outputText(S.outTab))}</textarea></div>${S.job && S.job.kind !== "importXml" ? `<div class="skeleton" role="status"><span class="ring" aria-hidden="true"></span><span>${esc(S.job.label)}…</span><progress value="${S.job.progress}" max="100" style="width:200px"></progress><button class="subtle" data-act="cancel-job">Cancel</button></div>` : ""}</aside>`;

  return `<div class="B" style="display:flex;flex-direction:column;height:100%">
    <div class="header"><b>BS2BG</b><div class="pivot" role="tablist" aria-label="Areas"><button role="tab" aria-selected="${S.area === "templates"}" data-act="rail" data-id="templates">Templates</button><button role="tab" aria-selected="${S.area === "morphs"}" data-act="rail" data-id="morphs">Morphs</button></div><span class="grow"></span>
      <div class="hjob">${S.job ? `<span class="ring" aria-hidden="true"></span><span class="muted">${esc(S.job.label)}… ${Math.round(S.job.progress)}%</span><button class="subtle" data-act="cancel-job">Cancel</button>` : ""}</div>
      <span class="toggle" role="switch" aria-checked="${S.uunp}" data-act="uunp" tabindex="0"><span class="sw" aria-hidden="true"></span>UUNP</span>
      <button class="primary" data-act="job" data-kind="${S.area === "templates" ? "generateTemplates" : "generateMorphs"}" ${S.job ? "disabled" : ""}>▶ Generate</button>
      <button class="subtle" data-act="toggle-drawer" aria-pressed="${S.drawer}" title="Output (Ctrl+\`)">Output</button>
      <button class="subtle" data-act="open-activity" aria-label="Activity">🔔${S.notes.length ? `<span class="badge">${S.notes.length}</span>` : ""}</button><button class="subtle" data-act="noop">⋯</button></div>
    <div class="shell ${narrow ? "narrow" : S.drawer ? "" : "nooutput"}">
      <div class="main ${narrow ? "narrow" : ""}">${narrow ? picker : `<div class="master">${master}</div>`}<div class="detail">${detail}</div></div>
      ${narrow ? (S.drawer ? `<div class="scrim" data-act="toggle-drawer"></div><div class="sheet">${outpane}</div>` : "") : (S.drawer ? outpane : "")}
      ${S.overlay === "activity" ? `<div class="menu card"><div class="row" style="padding:6px 8px;border-bottom:1px solid var(--border)"><b class="grow">Activity</b><button class="subtle" data-act="clear-notes">Clear</button><button class="subtle icon" data-act="close-overlay" aria-label="Close">✕</button></div><ul>${S.notes.map(n => `<li><span class="muted mono">${fmtTime(n.time)}</span><span aria-hidden="true">${ICO[n.sev]}</span><span>${esc(n.text)}</span></li>`).join("") || `<li class="muted">No activity yet.</li>`}</ul></div>` : ""}
    </div>
    ${toastsHtml()}${confirmDialog()}</div>`;
}

/* ═══════════════════════════ Variant C · Ledger Pages ═══════════════════════════ */
function renderC() {
  const narrow = S.narrow;
  const nav = (id, label, badge = "") => `<button class="nav-item" data-act="page" data-id="${id}" aria-current="${S.page === id ? "page" : "false"}">${label}${badge}</button>`;
  const navHtml = `<nav class="nav" aria-label="Pages"><div class="brand">BS2BG</div>${nav("templates", "▤ Templates")}${nav("morphs", "☺ Morphs")}${nav("npcs", "≡ NPC Assignments", S.npcs.filter(n => !n.presets.length).length ? `<span class="badge" style="background:var(--warning);color:#000" title="NPCs without presets">${S.npcs.filter(n => !n.presets.length).length}</span>` : "")}${nav("output", "⤓ Output", S.outputBadge ? `<span class="dot"></span>` : "")}${nav("activity", "🔔 Activity", S.notes.length ? `<span class="badge">${S.notes.length}</span>` : "")}<span class="spacer"></span>${nav("settings", "⚙ Settings")}</nav>`;

  const sticky = S.job ? `<div class="infobar info" role="status" style="border-radius:0;border-left-width:4px"><span class="ring" aria-hidden="true"></span><span class="grow">${esc(S.job.label)}…</span><progress value="${S.job.progress}" max="100" style="width:200px"></progress><span class="mono">${Math.round(S.job.progress)}%</span><button class="subtle" data-act="cancel-job">Cancel</button></div>` : (S.notes[0] && !S.notes[0].dismissed && (Date.now() - S.notes[0].time < 8000 || S.notes[0].durable) ? infobar(S.notes[0], S.notes[0].sev === "error" ? `<button class="subtle" data-act="page" data-id="activity">Details</button>` : "") : "");

  let page;
  if (S.page === "templates") {
    page = `<div class="cmdbar">${narrow ? `<button class="subtle icon hamb" data-act="overlay" data-o="nav" aria-label="Menu">☰</button>` : ""}<h2 style="margin-right:8px">Templates</h2>${templateCommands()}<span class="grow"></span><input type="search" placeholder="Search (Ctrl+K)" value="${esc(S.search)}" data-input="search" aria-label="Search presets"><button class="primary" data-act="job" data-kind="generateTemplates" ${S.job ? "disabled" : ""}>▶ Generate</button></div>${sticky}
      <div class="content"><div class="card"><table role="grid" aria-label="Slider Presets"><thead><tr><th style="width:24px"></th><th>Name</th>${narrow ? "" : `<th>Body</th><th>Sliders</th><th>Used by</th>`}<th>Template line</th></tr></thead><tbody>${visPresets().map(p => { const i = S.presets.indexOf(p); const ex = S.expanded === i; return `<tr role="row" data-idx="${i}" data-list="presets" aria-selected="${i === S.selPreset}" aria-expanded="${ex}" tabindex="${i === S.selPreset ? 0 : -1}" data-act="expand"><td><span class="chev" aria-hidden="true">▸</span></td><td><b>${esc(p.name)}</b></td>${narrow ? "" : `<td>${p.uunp ? "UUNP" : "CBBE"}</td><td class="mono">${p.sliders}</td><td class="mono">${S.targets.filter(t => t.presets.includes(p.name)).length + S.npcs.filter(n => n.presets.includes(p.name)).length}</td>`}<td class="mono muted" style="max-width:420px;overflow:hidden;text-overflow:ellipsis">${esc(p.line.split("=")[1])}</td></tr>${ex ? `<tr class="exp"><td colspan="${narrow ? 3 : 6}"><div class="grid ${narrow ? "narrow" : ""}"><div><div class="muted">Template line</div><textarea readonly style="height:72px" aria-label="Template line">${esc(p.line)}</textarea><div class="acts"><button data-act="noop">Edit SetSliders…</button><button class="subtle" data-act="noop">Rename…</button><button class="subtle" data-act="noop">Duplicate</button><button class="subtle" data-act="toggle-bos">BoS JSON</button><button class="subtle danger" data-act="remove-preset">Remove</button></div></div><dl class="kv"><dt>Body</dt><dd>${p.uunp ? "UUNP" : "CBBE"}</dd><dt>Sliders</dt><dd>${p.sliders}</dd><dt>Targets</dt><dd>${S.targets.filter(t => t.presets.includes(p.name)).map(t => `<span class="chip mono">${esc(t.name)}</span>`).join(" ") || "—"}</dd><dt>NPCs</dt><dd>${S.npcs.filter(n => n.presets.includes(p.name)).length}</dd></dl></div></td></tr>` : ""}`; }).join("")}</tbody></table></div></div>`;
  } else if (S.page === "morphs") {
    page = `<div class="cmdbar">${narrow ? `<button class="subtle icon hamb" data-act="overlay" data-o="nav" aria-label="Menu">☰</button>` : ""}<h2 style="margin-right:8px">Morphs</h2>${morphCommands()}<span class="grow"></span><button class="primary" data-act="job" data-kind="generateMorphs" ${S.job ? "disabled" : ""}>▶ Generate</button></div>${sticky}
      <div class="content"><h3>Custom Morph Targets</h3><div class="card"><table role="grid" aria-label="Custom Morph Targets"><thead><tr><th style="width:24px"></th><th>Target</th><th>Slider Presets</th><th style="width:60px">Count</th></tr></thead><tbody>${S.targets.map((t, i) => { const ex = S.expanded === i && S.morphFocus === "targets"; return `<tr role="row" data-idx="${i}" data-list="targets" aria-selected="${S.morphFocus === "targets" && i === S.selTarget}" aria-expanded="${ex}" tabindex="${i === S.selTarget ? 0 : -1}" data-act="expand"><td><span class="chev" aria-hidden="true">▸</span></td><td class="mono"><b>${esc(t.name)}</b></td><td>${t.presets.map(p => `<span class="chip">${esc(p)}</span>`).join(" ") || `<span style="color:var(--warning)">— no presets, will be skipped —</span>`}</td><td class="mono">${t.presets.length}</td></tr>${ex ? `<tr class="exp"><td colspan="4"><div class="card">${presetsForTarget(t)}</div></td></tr>` : ""}`; }).join("")}</tbody></table></div><p class="muted">Individual NPCs live on their own page — <button class="subtle" data-act="page" data-id="npcs" style="height:24px">NPC Assignments →</button></p></div>`;
  } else if (S.page === "npcs") {
    page = `<div class="cmdbar">${narrow ? `<button class="subtle icon hamb" data-act="overlay" data-o="nav" aria-label="Menu">☰</button>` : ""}<h2 style="margin-right:8px">NPC Assignments</h2><button data-act="noop">＋ Add NPCs…</button><button class="subtle" data-act="noop">View Image</button><button class="subtle danger" data-act="noop">Remove</button><button class="subtle danger" data-act="noop">Clear</button><span class="grow"></span><button class="primary" data-act="job" data-kind="generateMorphs" ${S.job ? "disabled" : ""}>▶ Generate Morphs</button></div>${sticky}
      <div class="content"><div class="card">${npcTable("tvNpc", true)}</div>${S.morphFocus === "npcs" ? `<div class="card">${presetsForTarget(curTarget())}</div>` : `<p class="muted">Select an NPC row to edit its presets below the table.</p>`}</div>`;
  } else if (S.page === "output") {
    S.outputBadge = false;
    page = `<div class="cmdbar">${narrow ? `<button class="subtle icon hamb" data-act="overlay" data-o="nav" aria-label="Menu">☰</button>` : ""}<h2 style="margin-right:8px">Output</h2><span class="toggle" role="switch" aria-checked="${S.omit}" data-act="omit" tabindex="0"><span class="sw" aria-hidden="true"></span>Omit redundant sliders</span><span class="sep"></span><button data-act="job" data-kind="generateTemplates" ${S.job ? "disabled" : ""}>▶ Generate Templates</button><button data-act="job" data-kind="generateMorphs" ${S.job ? "disabled" : ""}>▶ Generate Morphs</button><span class="grow"></span><button class="subtle" data-act="copy">Copy</button><button class="primary" data-act="job" data-kind="exportIni" ${S.job ? "disabled" : ""}>Export INIs…</button><button data-act="job" data-kind="exportBos" ${S.job ? "disabled" : ""}>Export BoS JSON…</button></div>${sticky}
      <div class="content">${S.output.stale && S.output.at ? infobar({ id: 0, sev: "warning", text: "The Project changed after this output was generated. Regenerate before exporting." }) : ""}<div class="outgrid ${narrow ? "narrow" : ""}"><div class="pane"><header><b>templates.ini</b><span class="muted">${S.output.templates ? S.output.templates.split("\n").length + " lines" : ""}</span></header><div class="body" style="padding:6px"><textarea readonly aria-label="templates.ini">${esc(outputText("templates"))}</textarea></div></div><div class="pane"><header><b>morphs.ini</b><span class="muted">${S.output.morphs ? S.output.morphs.split("\n").length + " lines" : ""}</span></header><div class="body" style="padding:6px"><textarea readonly aria-label="morphs.ini">${esc(outputText("morphs"))}</textarea></div></div></div></div>`;
  } else if (S.page === "activity") {
    page = `<div class="cmdbar">${narrow ? `<button class="subtle icon hamb" data-act="overlay" data-o="nav" aria-label="Menu">☰</button>` : ""}<h2 style="margin-right:8px">Activity</h2><span class="grow"></span><button class="subtle" data-act="clear-notes">Clear history</button></div>${S.job ? sticky : ""}
      <div class="content"><div class="card activity"><ul>${S.notes.map(n => `<li><span class="muted mono">${fmtTime(n.time)}</span><span aria-hidden="true">${ICO[n.sev]}</span><span>${esc(n.text)}</span>${n.sev === "error" ? `<button class="subtle" data-act="noop">Copy diagnostics</button>` : ""}</li>`).join("") || `<li class="muted">No activity yet. Jobs, imports, warnings, and errors are recorded here so nothing important lives only in a toast.</li>`}</ul></div></div>`;
  } else {
    page = `<div class="cmdbar"><h2>Settings</h2></div><div class="content"><div class="card" style="padding:14px"><p class="muted">Theme: follow Windows / Light / Dark. High contrast always follows Windows.</p></div></div>`;
  }
  return `<div class="C" style="display:flex;flex-direction:column;height:100%"><div class="shell ${narrow ? "narrow" : ""}">${narrow ? "" : navHtml}<div class="page">${page}</div>${narrow && S.overlay === "nav" ? `<div class="scrim" data-act="close-overlay"></div><div class="side-overlay" role="dialog" aria-label="Menu">${navHtml}</div>` : ""}</div>${confirmDialog()}</div>`;
}

/* ═══════════════════════════ Help / design notes per variant ═══════════════════════════ */
const HELP = {
  A: `<h2>A · Rail Studio</h2><p><b>Argument:</b> the modder works on one preset/target at a time, so give it three persistent panes — list, editor, inspector — and keep the output out of the way in a bottom drawer that surfaces when a job finishes.</p>
<h3>Structure</h3><ul><li>48px icon rail: Templates, Morphs, Output (drawer toggle), Settings. Rail item badges = attention.</li><li>Command bar changes with the area; Generate/Export always at the right end.</li><li>Inspector = read-only facts + the actions that apply to the selection (SetSliders, Rename, Remove; for morphs: presets-for-target editor).</li><li>Output drawer shows both INIs side by side; header stays visible when collapsed.</li></ul>
<h3>Narrow (&lt;~900px)</h3><ul><li>List and Inspector become side overlays opened from the title bar (or F6/F7). Editor keeps full width.</li></ul>
<h3>Progress &amp; notifications</h3><ul><li>Progress lives in the <b>status bar</b> (label, bar, %, Cancel) plus a ring in the editor header.</li><li>Transient messages replace the status-bar text; durable warnings/errors are InfoBars at the top of the editor; everything is kept in Activity (status bar button).</li><li>Confirmations stay modal (dialog).</li></ul>
<h3>Keys</h3><table><tr><td><kbd>Ctrl</kbd>+<kbd>1</kbd>/<kbd>2</kbd></td><td>Templates / Morphs</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>\`</kbd></td><td>Toggle output drawer</td></tr><tr><td><kbd>F6</kbd></td><td>Cycle list → editor → inspector</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>K</kbd></td><td>Focus search/filter</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>G</kbd> / <kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>Generate / Export</td></tr><tr><td><kbd>↑</kbd><kbd>↓</kbd> <kbd>Home</kbd> <kbd>End</kbd></td><td>Move in lists/tables</td></tr><tr><td><kbd>Esc</kbd></td><td>Close drawer / overlay / toast / dialog</td></tr></table>`,
  B: `<h2>B · Pivot Split</h2><p><b>Argument:</b> the generated INI text <i>is</i> the deliverable, so keep it permanently visible as a right pane and treat editing as master-detail on the left. No separate inspector — facts become a properties strip above the editor.</p>
<h3>Structure</h3><ul><li>Top Pivot (Templates | Morphs) in the header; Generate, UUNP, Output toggle and Activity bell live in the header too, so they never move.</li><li>Master list (240px) with its own action row; detail = properties strip + work area.</li><li>Output pane (380px) with templates.ini / morphs.ini tabs, Copy/Export in its header; collapsible.</li></ul>
<h3>Narrow</h3><ul><li>Master list becomes a ComboBox picker above the detail; output pane becomes a bottom sheet (Output button / Ctrl+\`).</li></ul>
<h3>Progress &amp; notifications</h3><ul><li>Progress = ring + % in the header <i>and</i> a skeleton overlay on the output pane (the thing being produced).</li><li><b>Toasts</b> top-right: info/success auto-dismiss in 5s; errors persist with Details → Activity flyout (bell).</li><li>Durable warnings also render as an InfoBar in the detail area.</li></ul>
<h3>Keys</h3><table><tr><td><kbd>Ctrl</kbd>+<kbd>1</kbd>/<kbd>2</kbd></td><td>Pivot</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>\`</kbd></td><td>Show/hide output pane</td></tr><tr><td><kbd>F6</kbd></td><td>Cycle master → detail → output</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>K</kbd></td><td>Search</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>G</kbd> / <kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>Generate / Export</td></tr><tr><td><kbd>Esc</kbd></td><td>Dismiss newest toast / flyout / sheet</td></tr></table>`,
  C: `<h2>C · Ledger Pages</h2><p><b>Argument:</b> drop persistent panes altogether. Each concern is a page reached from an expanded nav; rows expand inline to edit; Output and Activity are pages so nothing has to fit in a drawer or a toast. Narrow windows need no special mode.</p>
<h3>Structure</h3><ul><li>Expanded 200px nav: Templates, Morphs, NPC Assignments (badge = NPCs without presets), Output (dot = fresh result), Activity (badge = entries), Settings.</li><li>Every page: sticky command bar → optional sticky InfoBar → single scrolling column (max 1100px).</li><li>Rows expand in place (Enter/Space/click) to reveal the editor + facts; only one expanded at a time.</li><li>NPCs get their own page with the filter row and a presets editor under the table.</li></ul>
<h3>Narrow</h3><ul><li>Nav collapses to a ☰ menu; tables drop secondary columns; output panes stack.</li></ul>
<h3>Progress &amp; notifications</h3><ul><li>Progress = sticky InfoBar under the command bar with Cancel. Nothing floats.</li><li>Latest message shows in the same InfoBar slot (auto-clears after 8s unless durable); the full history is the Activity page.</li><li>Completion badges the Output nav item instead of pulling the user there.</li></ul>
<h3>Keys</h3><table><tr><td><kbd>Ctrl</kbd>+<kbd>1</kbd>…<kbd>5</kbd></td><td>Pages</td></tr><tr><td><kbd>F6</kbd></td><td>Nav ↔ command bar ↔ content</td></tr><tr><td><kbd>Enter</kbd>/<kbd>Space</kbd></td><td>Expand / collapse row</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>K</kbd></td><td>Search</td></tr><tr><td><kbd>Ctrl</kbd>+<kbd>G</kbd> / <kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>Generate / Export</td></tr><tr><td><kbd>Esc</kbd></td><td>Collapse row / close menu</td></tr></table>`,
};
const HELP_COMMON = `<h3>Questions to settle (react to any variant, or mix)</h3><ul><li>Navigation: icon rail (A) vs Pivot tabs (B) vs expanded nav with pages (C)?</li><li>Inspector: persistent pane (A) vs properties strip (B) vs inline expansion (C)?</li><li>Output: drawer (A) vs always-visible pane (B) vs page (C)? Should Generate auto-reveal it?</li><li>Progress: status bar (A) vs header ring + skeleton (B) vs sticky InfoBar (C)?</li><li>Notifications: which of the current CustomNotif messages are toast-worthy, which need an InfoBar, which need a modal? Is a durable Activity history wanted?</li><li>Narrow mode: overlays (A), picker + sheet (B), or no special mode (C)?</li><li>Theme: is the HC token set (flat fills, borders carry meaning, yellow highlight) acceptable as the contract? Should the app offer a manual light/dark override?</li></ul><p class="muted">Try: <b>Fail next job</b> then Generate; <b>Narrow</b>; theme <b>High contrast</b>; Tab through a variant with the mouse untouched.</p>`;

/* ═══════════════════════════ Render + wiring ═══════════════════════════ */
const app = document.getElementById("app");
function render() {
  const focused = document.activeElement, fid = focused && focused.id, fsel = focused && focused.getAttribute && focused.getAttribute("data-idx");
  // Full re-render on every change; keep scroll offsets of scrollable regions that carry an id
  // (elements without one are skipped — a bare "#" selector would throw and stall the job loop).
  const scrolls = [...app.querySelectorAll("[id].body, [id].content, [id][role=listbox]")].map(e => [e.id, e.scrollTop]);
  app.innerHTML = { A: renderA, B: renderB, C: renderC }[S.variant]();
  document.title = `PROTOTYPE · ${S.variant} ${VARIANTS[S.variant]} · BS2BG workbench`;
  scrolls.forEach(([id, t]) => { const e = document.getElementById(id); if (e) e.scrollTop = t; });
  if (fid) { const e = document.getElementById(fid); if (e) e.focus({ preventScroll: true }); }
  else if (fsel != null && focused.getAttribute("role")) { const e = app.querySelector(`[role="${focused.getAttribute("role")}"][data-idx="${fsel}"]`); if (e) e.focus({ preventScroll: true }); }
  const help = document.getElementById("help"); help.hidden = !S.help; help.innerHTML = HELP[S.variant] + HELP_COMMON;
}
function setVariant(v) { S.variant = v; S.overlay = null; S.drawer = v === "B"; try { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); } catch (e) { /* file:// in some browsers refuses replaceState; the bar still works */ } syncBar(); render(); }
function syncBar() {
  document.getElementById("pb-label").textContent = `${S.variant} (${VARIANTS[S.variant]})`;
  document.getElementById("pb-theme").value = S.theme;
  document.getElementById("pb-narrow").classList.toggle("on", S.narrow);
  document.getElementById("pb-motion").classList.toggle("on", S.motion === "reduced");
  document.getElementById("pb-fail").classList.toggle("on", S.failNext);
  document.getElementById("pb-help").classList.toggle("on", S.help);
  document.getElementById("stage").classList.toggle("narrow", S.narrow);
  const sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = S.theme === "system" ? sys : S.theme;
  document.documentElement.dataset.motion = S.motion === "reduced" || (S.motion === "auto" && matchMedia("(prefers-reduced-motion: reduce)").matches) ? "reduced" : "auto";
}
const cycle = d => { const ks = Object.keys(VARIANTS); setVariant(ks[(ks.indexOf(S.variant) + d + ks.length) % ks.length]); };
document.getElementById("pb-prev").onclick = () => cycle(-1);
document.getElementById("pb-next").onclick = () => cycle(1);
document.getElementById("pb-theme").onchange = e => { S.theme = e.target.value; syncBar(); };
document.getElementById("pb-narrow").onclick = () => { S.narrow = !S.narrow; S.overlay = null; syncBar(); render(); };
document.getElementById("pb-motion").onclick = () => { S.motion = S.motion === "reduced" ? "auto" : "reduced"; syncBar(); };
document.getElementById("pb-fail").onclick = () => { S.failNext = !S.failNext; syncBar(); };
document.getElementById("pb-help").onclick = () => { S.help = !S.help; syncBar(); render(); };

/* Actions — every variant emits the same data-act vocabulary so behavior is shared. */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  const opt = e.target.closest("[role=option]");
  if (opt && !act) return;
  switch (act) {
    case "rail": if (el.dataset.id === "output") { S.drawer = !S.drawer; } else if (el.dataset.id === "settings") { toast("info", "Settings is out of scope for this prototype."); } else { S.area = el.dataset.id; S.overlay = null; } break;
    case "page": S.page = el.dataset.id; S.overlay = null; if (el.dataset.id === "npcs") S.morphFocus = "npcs"; if (el.dataset.id === "morphs") S.morphFocus = "targets"; if (el.dataset.id === "activity") S.notes.forEach(n => n.dismissed = true); break;
    case "job": startJob(el.dataset.kind); return;
    case "cancel-job": cancelJob(); return;
    case "toggle-drawer": S.drawer = !S.drawer; break;
    case "outtab": S.outTab = el.dataset.t; break;
    case "overlay": S.overlay = S.overlay === el.dataset.o ? null : el.dataset.o; break;
    case "close-overlay": S.overlay = null; break;
    case "open-activity": S.overlay = S.overlay === "activity" ? null : "activity"; S.toasts = S.toasts.filter(t => t.sev !== "error"); break;
    case "clear-notes": S.notes = []; S.toasts = []; break;
    case "dismiss": { const n = S.notes.find(x => x.id == el.dataset.id); if (n) n.dismissed = true; S.toasts = S.toasts.filter(t => t.id != el.dataset.id); break; }
    case "uunp": S.uunp = !S.uunp; S.output.stale = true; S.selPreset = S.presets.findIndex(p => p.uunp === S.uunp); break;
    case "omit": S.omit = !S.omit; S.output.stale = true; break;
    case "toggle-bos": S.showBos = !S.showBos; break;
    case "copy": toast(S.output.templates || S.output.morphs ? "success" : "warning", S.output.templates || S.output.morphs ? "Output copied to clipboard!" : "There is nothing in the output, generate first!"); return;
    case "expand": { const i = +el.dataset.idx; S.expanded = S.expanded === i ? null : i; if (el.dataset.list === "presets") S.selPreset = i; else { S.selTarget = i; S.morphFocus = "targets"; } break; }
    case "add-target": { const inp = app.querySelector('[data-input="newTarget"]'); const v = (inp && inp.value || "").trim(); if (!v) { toast("warning", "Enter a target such as All|Female."); return; } if (S.targets.some(t => t.name.toLowerCase() === v.toLowerCase())) { toast("error", `A Custom Morph Target named "${v}" already exists.`); return; } S.targets.push({ name: v, presets: [] }); S.selTarget = S.targets.length - 1; S.morphFocus = "targets"; S.output.stale = true; note("success", `Added ${v}.`); break; }
    case "assign": { const sel = app.querySelector('[data-input="assignPick"]'); const v = sel && sel.value; if (!v) return; curTarget().presets.push(v); S.output.stale = true; break; }
    case "assign-all": curTarget().presets = S.presets.map(p => p.name); S.output.stale = true; break;
    case "unassign": curTarget().presets = curTarget().presets.filter(p => p !== el.dataset.p); S.output.stale = true; break;
    case "clear-target": confirm2(`Clear all Slider Presets from ${curTarget().name}?`, () => { curTarget().presets = []; S.output.stale = true; }); return;
    case "clear-assignments": confirm2("Clear the Slider Presets of every NPC currently shown in the table?", () => { visNpcs().forEach(n => n.presets = []); S.output.stale = true; note("info", `${visNpcs().length} NPCs cleared.`); }); return;
    case "fill-empty": { const empty = S.npcs.filter(n => !n.presets.length); if (!empty.length) { toast("info", "No NPC in the table is empty!"); return; } confirm2(`Assign a random Slider Preset to ${empty.length} NPCs without presets?`, () => { empty.forEach(n => n.presets = [S.presets[Math.floor(Math.random() * 8)].name]); S.output.stale = true; note("success", `${empty.length} NPCs filled.`); }); return; }
    case "remove-preset": confirm2(`Remove "${curPreset().name}"? It is referenced by ${S.targets.filter(t => t.presets.includes(curPreset().name)).length} targets and ${S.npcs.filter(n => n.presets.includes(curPreset().name)).length} NPCs; those references will be removed too.`, () => { const nm = curPreset().name; S.presets.splice(S.selPreset, 1); S.targets.forEach(t => t.presets = t.presets.filter(p => p !== nm)); S.npcs.forEach(n => n.presets = n.presets.filter(p => p !== nm)); S.selPreset = Math.max(0, S.selPreset - 1); S.output.stale = true; note("info", `Removed ${nm}.`); }); return;
    case "clear-presets": confirm2("Remove every Slider Preset from the Project?", () => toast("info", "(prototype) not actually cleared")); return;
    case "confirm-yes": { const c = S.pendingConfirm; S.pendingConfirm = null; c.onOk(); break; }
    case "confirm-no": S.pendingConfirm = null; break;
    case "noop": toast("info", `"${el.textContent.trim().replace(/…$/, "")}" opens the existing popup flow — unchanged by this prototype.`); return;
  }
  render();
});
app.addEventListener("click", e => {
  const opt = e.target.closest("[role=option]"); if (opt) { selectFromList(opt.parentElement.dataset.list, +opt.dataset.idx); return; }
  const tr = e.target.closest("tr[data-npc]"); if (tr) { S.selNpc = +tr.dataset.npc; S.morphFocus = "npcs"; render(); }
});
app.addEventListener("input", e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === "search") { S.search = e.target.value; render(); }
  if (k === "npcFilter") { S.npcFilter = e.target.value; render(); }
});
app.addEventListener("change", e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === "pickPreset") { S.selPreset = +e.target.value; render(); }
  if (k === "pickTarget") { const v = e.target.value; S.morphFocus = v[0] === "t" ? "targets" : "npcs"; if (v[0] === "t") S.selTarget = +v.slice(1); else S.selNpc = +v.slice(1); render(); }
});
function selectFromList(list, i) {
  if (list === "presets") S.selPreset = i;
  if (list === "targets") { S.selTarget = i; S.morphFocus = "targets"; }
  if (list === "npcs") { S.selNpc = i; S.morphFocus = "npcs"; }
  render();
}

/* Keyboard: list/table arrows, F6 pane cycling, accelerators, Esc, and ←/→ for the switcher. */
document.addEventListener("keydown", e => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  const lb = e.target.closest && e.target.closest("[role=listbox]");
  const row = e.target.closest && e.target.closest("tr[data-npc], tr[data-act=expand]");
  if (lb && ["ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) {
    e.preventDefault(); const list = lb.dataset.list; const opts = [...lb.querySelectorAll("[role=option]")]; const cur = opts.findIndex(o => o.getAttribute("aria-selected") === "true");
    const n = e.key === "Home" ? 0 : e.key === "End" ? opts.length - 1 : Math.max(0, Math.min(opts.length - 1, cur + (e.key === "ArrowDown" ? 1 : -1)));
    selectFromList(list, +opts[n].dataset.idx); const el = app.querySelector(`[data-list="${list}"] [role=option][data-idx="${opts[n].dataset.idx}"]`); if (el) { el.setAttribute("tabindex", "0"); el.focus(); el.scrollIntoView({ block: "nearest" }); } return;
  }
  if (row && ["ArrowUp", "ArrowDown"].includes(e.key)) {
    e.preventDefault(); const rows = [...row.parentElement.querySelectorAll("tr[data-npc], tr[data-act=expand]")]; const i = rows.indexOf(row); const nx = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
    if (nx.dataset.npc != null) { S.selNpc = +nx.dataset.npc; S.morphFocus = "npcs"; render(); const el = app.querySelector(`tr[data-npc="${nx.dataset.npc}"]`); el && el.focus(); }
    else { const li = nx.dataset.list, ix = +nx.dataset.idx; if (li === "presets") S.selPreset = ix; else S.selTarget = ix; render(); const el = app.querySelector(`tr[data-list="${li}"][data-idx="${ix}"]`); el && el.focus(); }
    return;
  }
  if (row && (e.key === "Enter" || e.key === " ") && row.dataset.act === "expand") { e.preventDefault(); row.click(); const el = app.querySelector(`tr[data-list="${row.dataset.list}"][data-idx="${row.dataset.idx}"]`); el && el.focus(); return; }
  if (e.target.matches && e.target.matches("[role=switch], .drawer > header") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.target.click(); return; }
  if (e.key === "Escape") {
    if (S.pendingConfirm) S.pendingConfirm = null;
    else if (S.overlay) S.overlay = null;
    else if (S.toasts.length) S.toasts.pop();
    else if (S.variant === "C" && S.expanded != null) S.expanded = null;
    else if (S.drawer && S.variant !== "B") S.drawer = false;
    else if (S.variant === "B" && S.narrow && S.drawer) S.drawer = false;
    else return; render(); return;
  }
  if (e.ctrlKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "`") { e.preventDefault(); S.drawer = !S.drawer; render(); return; }
    if (k === "k") { e.preventDefault(); const s = app.querySelector('input[type=search]'); if (s) s.focus(); else { if (S.variant === "A" && S.narrow) { S.overlay = "list"; render(); } } return; }
    if (k === "g") { e.preventDefault(); startJob(S.area === "templates" && S.page !== "npcs" && S.page !== "morphs" ? "generateTemplates" : "generateMorphs"); return; }
    if (k === "e") { e.preventDefault(); startJob("exportIni"); return; }
    if (/^[1-5]$/.test(k)) {
      e.preventDefault();
      if (S.variant === "C") { S.page = ["templates", "morphs", "npcs", "output", "activity"][+k - 1]; if (S.page === "npcs") S.morphFocus = "npcs"; }
      else if (k === "1" || k === "2") S.area = k === "1" ? "templates" : "morphs";
      S.overlay = null; render(); return;
    }
  }
  if (e.key === "F6") {
    e.preventDefault();
    const sel = S.variant === "A" ? (S.narrow ? ["[data-act=rail]", ".col .body", ".drawer > header"] : ["[data-act=rail][aria-current=page]", "#paneList [role=listbox], #paneList input", "#paneEditor textarea, #paneEditor table", "#paneInspector button, #paneInspector select", ".drawer > header"])
      : S.variant === "B" ? ["[role=tab][aria-selected=true]", ".master [role=listbox], .picker select", ".detail textarea, .detail select, .detail button", ".outpane textarea"]
      : [".nav-item[aria-current=page], .hamb", ".cmdbar button", ".content [tabindex='0'], .content textarea, .content button"];
    const targets = sel.map(s => app.querySelector(s)).filter(Boolean);
    const cur = targets.findIndex(t => t === document.activeElement || t.contains(document.activeElement));
    const nx = targets[(cur + (e.shiftKey ? -1 : 1) + targets.length) % targets.length]; if (nx) { if (nx.tagName === "UL") nx.setAttribute("tabindex", "0"); nx.focus(); }
    return;
  }
  if (e.key === "F7" && S.variant === "A" && S.narrow) { e.preventDefault(); S.overlay = S.overlay === "inspector" ? null : "inspector"; render(); return; }
  if (!inField && !e.ctrlKey && !e.altKey) {
    if (e.key === "ArrowLeft" && !lb && !row) { cycle(-1); return; }
    if (e.key === "ArrowRight" && !lb && !row) { cycle(1); return; }
    if (e.key === "?") { S.help = !S.help; syncBar(); render(); return; }
  }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncBar);

/* Boot */
(function () {
  const v = new URLSearchParams(location.search).get("variant") || (location.hash || "").replace("#", "");
  S.variant = VARIANTS[v] ? v : "A"; S.drawer = S.variant === "B";
  syncBar(); render();
  note("info", "Project MyBodies.jbs2bg opened — 10 presets, 4 targets, 14 NPCs.");
  render();
})();
</script>
</body>
</html>
