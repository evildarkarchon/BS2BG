# Registers com.asdasfa.jbs2bg.fx.FxTestExtension (listed in META-INF/services) for every test in the JVM, so a
# leaked window, an uncaught JavaFX-thread exception or a tripped headless accessibility tripwire can never escape
# a test class that forgot to opt in. The extension does nothing until some test has started the JavaFX toolkit.
junit.jupiter.extensions.autodetection.enabled=true
